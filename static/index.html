<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动物园谱系与繁育协调</title>
  <style>
    :root { --line: #e5e7eb; --ink: #1f2937; --muted: #6b7280; --ok: #047857; --bad: #b91c1c; --warn: #b45309; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; color: var(--ink); background: #f9fafb; }
    main { max-width: 1080px; margin: auto; padding: 1.5rem 1rem 4rem; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin: 0 0 .75rem; }
    section { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.25rem; }
    label { display: block; font-size: .8rem; color: var(--muted); margin: .5rem 0 .2rem; }
    input, select { width: 100%; padding: .45rem .55rem; border: 1px solid var(--line); border-radius: 6px; font-size: .9rem; }
    button { padding: .45rem .8rem; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; font-size: .85rem; }
    button:hover { background: #f3f4f6; }
    button.primary { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
    button.primary:hover { background: #1e40af; }
    button.danger { color: var(--bad); border-color: #fecaca; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: end; }
    .row > div { flex: 1; min-width: 120px; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .tag { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .75rem; background: #eef2ff; color: #3730a3; }
    .tag.ok { background: #ecfdf5; color: var(--ok); }
    .tag.bad { background: #fef2f2; color: var(--bad); }
    .tag.warn { background: #fffbeb; color: var(--warn); }
    .card { border: 1px solid var(--line); border-radius: 8px; padding: .8rem 1rem; margin-bottom: .8rem; }
    .card h3 { margin: 0 0 .5rem; font-size: .95rem; }
    .pair-side { display: inline-block; min-width: 45%; padding: .5rem .75rem; margin: .2rem .4rem .2rem 0; border: 1px solid var(--line); border-radius: 8px; background: #fafafa; font-size: .85rem; }
    .banner { border-radius: 8px; padding: .5rem .75rem; margin: .5rem 0; font-size: .85rem; }
    .banner.bad { background: #fef2f2; color: var(--bad); border: 1px solid #fecaca; }
    .banner.ok { background: #ecfdf5; color: var(--ok); border: 1px solid #a7f3d0; }
    .banner.warn { background: #fffbeb; color: var(--warn); border: 1px solid #fde68a; }
    #toast { position: fixed; right: 1rem; bottom: 1rem; max-width: 420px; padding: .7rem 1rem; border-radius: 8px; font-size: .85rem; display: none; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
    #toast.err { display: block; background: #fef2f2; color: var(--bad); border: 1px solid #fecaca; }
    #toast.ok { display: block; background: #ecfdf5; color: var(--ok); border: 1px solid #a7f3d0; }
    .muted { color: var(--muted); font-size: .8rem; }
    .mono { font-family: ui-monospace, monospace; font-size: .78rem; }
    .actions { margin-top: .5rem; display: flex; gap: .4rem; flex-wrap: wrap; }
  </style>
</head>
<body>
<main>
  <h1>动物园谱系与繁育协调</h1>

  <section>
    <h2>当前身份</h2>
    <div class="row">
      <div><label>账号（X-User-Id）</label><input id="userId" value="vet-1"></div>
      <div><label>角色（X-Role）</label>
        <select id="role">
          <option value="admin">admin 管理员</option>
          <option value="registrar">registrar 档案员</option>
          <option value="veterinarian" selected>veterinarian 兽医</option>
          <option value="coordinator">coordinator 繁育协调员</option>
          <option value="committee">committee 繁育委员会</option>
          <option value="viewer">viewer 访客</option>
        </select>
      </div>
      <div style="flex:0"><button onclick="refreshAll()">刷新全部</button></div>
    </div>
    <p class="muted">兽医用各自账号录入健康检查；协调员提交配对建议；委员会批准/驳回。权限由服务端校验，越权操作会在此提示。</p>
  </section>

  <div class="grid">
    <section>
      <h2>动物登记（档案员）</h2>
      <label>名字</label><input id="animalName" placeholder="如：圆圆">
      <label>性别</label>
      <select id="animalSex"><option value="male">雄性</option><option value="female">雌性</option><option value="unknown">未知</option></select>
      <label>父亲编号（可选，用于亲缘计算）</label><input id="animalSireId" placeholder="sire_id">
      <label>母亲编号（可选）</label><input id="animalDamId" placeholder="dam_id">
      <div class="actions"><button class="primary" onclick="createAnimal()">登记动物</button></div>
    </section>

    <section>
      <h2>健康检查录入（兽医）</h2>
      <label>动物</label><select id="examAnimal"></select>
      <label>检查日期</label><input id="examDate" type="date">
      <label>结论</label>
      <select id="examResult"><option value="passed">通过</option><option value="failed">不通过</option></select>
      <div class="actions"><button class="primary" onclick="createExam()">录入检查</button></div>
      <p class="muted">检查编号由系统生成；配对建议必须引用双方<b>最近一次</b>检查。</p>
    </section>
  </div>

  <section>
    <h2>动物列表</h2>
    <table id="animalTable"><thead><tr>
      <th>编号</th><th>名字</th><th>性别</th><th>当前状态</th><th>最近检查</th><th>操作</th>
    </tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>健康检查记录</h2>
    <table id="examTable"><thead><tr>
      <th>检查编号</th><th>动物</th><th>日期</th><th>结论</th><th>录入人</th>
    </tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>提交配对建议（协调员）</h2>
    <div class="row">
      <div><label>雄性动物</label><select id="pairSire" onchange="fillExamSelects()"></select></div>
      <div><label>雄性最近检查编号</label><select id="pairSireExam"></select></div>
    </div>
    <div class="row">
      <div><label>雌性动物</label><select id="pairDam" onchange="fillExamSelects()"></select></div>
      <div><label>雌性最近检查编号</label><select id="pairDamExam"></select></div>
    </div>
    <div class="actions"><button class="primary" onclick="createPairing()">提交建议</button></div>
    <p class="muted">批准条件：双方最近一次检查均通过、双方当前在馆健康、亲缘风险 ≤ 0.125。</p>
  </section>

  <section>
    <h2>配对建议（繁育委员会视图）</h2>
    <div id="pairingList"></div>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const STATUS_LABEL = { active: '在馆健康', quarantined: '隔离', departed: '离馆', deceased: '死亡' };
const PAIR_STATUS = { proposed: '待审批', approved: '已批准', rejected: '已驳回', completed: '已登记产仔' };
const SEX_LABEL = { male: '雄性', female: '雌性', unknown: '未知' };
let animals = [], exams = [], pairings = [];

function headers() {
  return { 'Content-Type': 'application/json', 'X-User-Id': $('userId').value.trim() || 'anonymous', 'X-Role': $('role').value };
}
function toast(message, ok) {
  const el = $('toast');
  el.textContent = message;
  el.className = ok ? 'ok' : 'err';
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.className = ''; el.style.display = 'none'; }, 6000);
  el.style.display = 'block';
}
async function api(method, path, body) {
  const response = await fetch(path, { method, headers: headers(), body: body ? JSON.stringify(body) : undefined });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) {
    const err = new Error(payload.error || ('HTTP ' + response.status));
    err.payload = payload;
    throw err;
  }
  return payload;
}
async function run(fn, okMessage) {
  try {
    const result = await fn();
    if (okMessage) toast(okMessage, true);
    await refreshAll();
    return result;
  } catch (err) {
    toast(err.message, false);
  }
}

async function refreshAll() {
  const [a, e, p] = await Promise.all([
    api('GET', '/api/animal'), api('GET', '/api/health_exam'), api('GET', '/api/pairing'),
  ]);
  animals = a.items; exams = e.items; pairings = p.items;
  renderAnimals(); renderExams(); renderPairForm(); renderPairings();
}

function animalLabel(animal) { return animal ? `${animal.data.name || ''}（${animal.id.slice(0, 8)}…）` : ''; }
function latestExamOf(animalId) {
  const mine = exams.filter((x) => x.data.animal_id === animalId);
  if (!mine.length) return null;
  return mine.slice().sort((x, y) => String(y.data.exam_date || y.created_at).localeCompare(String(x.data.exam_date || x.created_at)))[0];
}
function statusTag(status) {
  const cls = status === 'active' ? 'ok' : (status === 'deceased' ? 'bad' : 'warn');
  return `<span class="tag ${cls}">${STATUS_LABEL[status] || status}</span>`;
}

function renderAnimals() {
  const tbody = $('animalTable').querySelector('tbody');
  tbody.innerHTML = animals.map((a) => {
    const latest = latestExamOf(a.id);
    const examCell = latest
      ? `<span class="mono">${latest.id.slice(0, 8)}…</span> ${latest.data.result === 'passed' ? '<span class="tag ok">通过</span>' : '<span class="tag bad">不通过</span>'}`
      : '<span class="muted">无记录</span>';
    const actions = [];
    if (a.status === 'active') {
      actions.push(`<button onclick="animalAction('${a.id}','quarantine_animal',{reason:prompt('隔离原因')||'未填写'})">隔离</button>`);
      actions.push(`<button onclick="animalAction('${a.id}','depart_animal',{reason:prompt('离馆原因')||'未填写'})">离馆</button>`);
    }
    if (a.status === 'quarantined') {
      actions.push(`<button onclick="animalAction('${a.id}','release_quarantine',{})">解除隔离</button>`);
      actions.push(`<button onclick="animalAction('${a.id}','depart_animal',{reason:prompt('离馆原因')||'未填写'})">离馆</button>`);
    }
    if (a.status === 'departed') actions.push(`<button onclick="animalAction('${a.id}','return_animal',{})">回馆</button>`);
    if (a.status !== 'deceased') actions.push(`<button class="danger" onclick="animalAction('${a.id}','mark_deceased',{cause:prompt('死亡原因')||'未填写'})">死亡</button>`);
    return `<tr><td class="mono">${a.id.slice(0, 8)}…</td><td>${a.data.name || ''}</td><td>${SEX_LABEL[a.data.sex] || ''}</td><td>${statusTag(a.status)}</td><td>${examCell}</td><td class="actions">${actions.join('')}</td></tr>`;
  }).join('');
}
function animalAction(id, action, data) {
  return run(() => api('POST', `/api/entities/${id}/actions`, { action, data }), '操作成功');
}

function renderExams() {
  const tbody = $('examTable').querySelector('tbody');
  tbody.innerHTML = exams.map((x) => {
    const animal = animals.find((a) => a.id === x.data.animal_id);
    return `<tr><td class="mono">${x.id}</td><td>${animalLabel(animal)}</td><td>${x.data.exam_date || ''}</td>
      <td>${x.data.result === 'passed' ? '<span class="tag ok">通过</span>' : '<span class="tag bad">不通过</span>'}</td>
      <td>${x.created_by}</td></tr>`;
  }).join('');
}

function fillSelect(select, items, labelFn) {
  select.innerHTML = items.map((item) => `<option value="${item.id}">${labelFn(item)}</option>`).join('');
}
function renderPairForm() {
  fillSelect($('examAnimal'), animals, (a) => `${a.data.name || ''}（${STATUS_LABEL[a.status]}）`);
  fillSelect($('pairSire'), animals.filter((a) => a.data.sex !== 'female'), (a) => `${a.data.name || ''}（${STATUS_LABEL[a.status]}）`);
  fillSelect($('pairDam'), animals.filter((a) => a.data.sex !== 'male'), (a) => `${a.data.name || ''}（${STATUS_LABEL[a.status]}）`);
  fillExamSelects();
}
function fillExamSelects() {
  const fill = (select, animalId) => {
    const mine = exams.filter((x) => x.data.animal_id === animalId);
    const latest = latestExamOf(animalId);
    select.innerHTML = mine.map((x) => {
      const mark = latest && x.id === latest.id ? '（最近一次）' : '';
      return `<option value="${x.id}" ${latest && x.id === latest.id ? 'selected' : ''}>${x.id.slice(0, 8)}… ${x.data.exam_date || ''} ${x.data.result === 'passed' ? '通过' : '不通过'}${mark}</option>`;
    }).join('') || '<option value="">该动物暂无检查记录</option>';
  };
  fill($('pairSireExam'), $('pairSire').value);
  fill($('pairDamExam'), $('pairDam').value);
}

function createAnimal() {
  const data = { name: $('animalName').value.trim(), sex: $('animalSex').value };
  if ($('animalSireId').value.trim()) data.sire_id = $('animalSireId').value.trim();
  if ($('animalDamId').value.trim()) data.dam_id = $('animalDamId').value.trim();
  return run(() => api('POST', '/api/animal', data), '动物已登记');
}
function createExam() {
  const data = { animal_id: $('examAnimal').value, result: $('examResult').value };
  if ($('examDate').value) data.exam_date = $('examDate').value;
  return run(() => api('POST', '/api/health_exam', data), '检查已录入');
}
function createPairing() {
  const data = {
    sire_id: $('pairSire').value, dam_id: $('pairDam').value,
    sire_exam_id: $('pairSireExam').value, dam_exam_id: $('pairDamExam').value,
  };
  return run(() => api('POST', '/api/pairing', data), '配对建议已提交');
}

function sideCard(side, title) {
  if (!side) return '';
  const ref = side.referenced_exam_id ? `<span class="mono">${side.referenced_exam_id.slice(0, 8)}…</span>` : '无';
  const latest = side.latest_exam_id
    ? `<span class="mono">${side.latest_exam_id.slice(0, 8)}…</span> ${side.latest_exam_result === 'passed' ? '<span class="tag ok">通过</span>' : '<span class="tag bad">不通过</span>'} ${side.latest_exam_date || ''}`
    : '<span class="muted">无记录</span>';
  return `<div class="pair-side"><b>${title}</b>：${side.animal_name || ''} <span class="mono">${side.animal_id.slice(0, 8)}…</span><br>
    当前状态：${statusTag(side.status)}<br>
    提交时引用检查：${ref}<br>最近检查：${latest}</div>`;
}

function renderPairings() {
  $('pairingList').innerHTML = pairings.map((p) => {
    const blockers = (p.blockers || []).map((b) => `<div class="banner bad">禁止登记产仔：${b.message}</div>`).join('');
    let gate = '';
    if (p.status === 'proposed') {
      gate = p.approvable
        ? '<div class="banner ok">满足批准条件：双方最近检查通过、均在馆健康、亲缘风险达标。</div>'
        : `<div class="banner warn">暂不满足批准条件：${(p.approval_issues || []).join('；')}</div>`;
    }
    const kinship = p.kinship_coefficient == null ? '未知' : p.kinship_coefficient.toFixed(3);
    const kinshipTag = p.kinship_within_limit ? '<span class="tag ok">≤ 0.125</span>' : '<span class="tag bad">&gt; 0.125</span>';
    const actions = [];
    if (p.status === 'proposed') {
      actions.push(`<button class="primary" onclick="pairAction('${p.id}','approve',{},${p.version})">批准</button>`);
      actions.push(`<button class="danger" onclick="pairAction('${p.id}','reject',{reason:prompt('驳回原因')||'未填写'},${p.version})">驳回</button>`);
    }
    if (p.status === 'rejected' || p.status === 'approved') {
      actions.push(`<button onclick="resubmit('${p.id}',${p.version})">重新送审</button>`);
    }
    if (p.status === 'approved') {
      actions.push(`<button class="primary" onclick="completePairing('${p.id}',${p.version})" ${p.can_register_offspring ? '' : 'disabled'}>登记产仔</button>`);
    }
    return `<div class="card">
      <h3>建议 <span class="mono">${p.id.slice(0, 8)}…</span> <span class="tag">${PAIR_STATUS[p.status] || p.status}</span>
        <span class="muted">提交人：${p.data.proposed_by || p.created_by}</span></h3>
      ${sideCard(p.sire, '雄性')}${sideCard(p.dam, '雌性')}
      <div class="muted">亲缘风险系数：${kinship} ${kinshipTag}</div>
      ${blockers}${gate}
      <div class="actions">${actions.join('')}</div>
    </div>`;
  }).join('') || '<p class="muted">暂无配对建议。</p>';
}
function pairAction(id, action, data, version) {
  return run(() => api('POST', `/api/entities/${id}/actions`, { action, data, expected_version: version }), '操作成功');
}
function resubmit(id, version) {
  const data = {};
  const sireExam = prompt('新的雄性最近检查编号（留空保持不变）');
  const damExam = prompt('新的雌性最近检查编号（留空保持不变）');
  if (sireExam) data.sire_exam_id = sireExam.trim();
  if (damExam) data.dam_exam_id = damExam.trim();
  return pairAction(id, 'resubmit', data, version);
}
function completePairing(id, version) {
  const input = prompt('产仔编号（多个用逗号分隔）', 'offspring-1');
  if (!input) return;
  return pairAction(id, 'complete', { offspring_ids: input.split(',').map((s) => s.trim()).filter(Boolean) }, version);
}

$('examDate').valueAsDate = new Date();
refreshAll().catch((err) => toast(err.message, false));
</script>
</body>
</html>
