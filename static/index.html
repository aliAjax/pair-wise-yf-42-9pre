<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动物园谱系与繁育协调</title>
  <style>
    :root {
      --ok: #047857; --warn: #b45309; --bad: #b91c1c; --line: #e5e7eb; --muted: #6b7280;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; background: #f9fafb; }
    main { max-width: 980px; margin: auto; }
    section { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
    h1 { margin-bottom: .25rem; }
    h2 { margin-top: 0; font-size: 1.1rem; }
    label { font-size: .85rem; color: var(--muted); margin-right: .4rem; }
    input, select, button { font-size: .9rem; padding: .35rem .55rem; margin: .15rem .25rem .15rem 0; }
    button { cursor: pointer; border: 1px solid #9ca3af; border-radius: 6px; background: #fff; }
    button.primary { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
    button.danger { color: var(--bad); border-color: #fca5a5; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    table { border-collapse: collapse; width: 100%; font-size: .88rem; }
    th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .tag { display: inline-block; padding: .05rem .5rem; border-radius: 999px; font-size: .78rem; }
    .tag.active, .tag.passed, .tag.approved, .tag.completed, .tag.authorized { background: #d1fae5; color: var(--ok); }
    .tag.pending, .tag.proposed, .tag.planned, .tag.in_transit, .tag.quarantined { background: #fef3c7; color: var(--warn); }
    .tag.failed, .tag.rejected, .tag.deceased, .tag.departed { background: #fee2e2; color: var(--bad); }
    .blocker { border: 1px solid #fca5a5; background: #fef2f2; color: var(--bad); border-radius: 8px; padding: .6rem .8rem; margin: .5rem 0; }
    .issue { color: var(--warn); font-size: .85rem; }
    .muted { color: var(--muted); font-size: .82rem; }
    .side-card { border: 1px solid var(--line); border-radius: 8px; padding: .6rem .8rem; margin: .4rem 0; }
    .side-card.blocked { border-color: #fca5a5; background: #fef2f2; }
    #toast { position: fixed; right: 1.5rem; bottom: 1.5rem; max-width: 24rem; white-space: pre-wrap; background: #111827; color: #f9fafb; padding: .7rem 1rem; border-radius: 8px; font-size: .85rem; display: none; }
    #toast.error { background: var(--bad); }
    code { background: #f3f4f6; padding: 0 .25rem; border-radius: 4px; }
  </style>
</head>
<body>
<main>
  <h1>动物园谱系与繁育协调</h1>
  <p class="muted">协调员提交建议时引用双方最近健康检查编号；兽医各自录入检查结果；繁育委员会依据双方检查、亲缘系数与动物实时状态批准。</p>

  <section>
    <h2>当前身份</h2>
    <label>用户编号</label><input id="userId" value="u-1" size="10">
    <label>角色</label>
    <select id="role">
      <option value="coordinator">coordinator 协调员</option>
      <option value="veterinarian">veterinarian 兽医</option>
      <option value="committee">committee 繁育委员会</option>
      <option value="registrar">registrar 登记员</option>
      <option value="admin">admin 管理员</option>
      <option value="viewer">viewer 只读</option>
    </select>
    <button onclick="loadAll()">刷新全部</button>
  </section>

  <section>
    <h2>动物</h2>
    <input id="animalName" placeholder="名称" size="10">
    <select id="animalSex"><option value="male">male</option><option value="female">female</option><option value="unknown">unknown</option></select>
    <button class="primary" onclick="createAnimal()">登记动物</button>
    <table><thead><tr><th>编号</th><th>名称</th><th>性别</th><th>状态</th><th>操作</th></tr></thead>
    <tbody id="animalsBody"></tbody></table>
  </section>

  <section>
    <h2>健康检查（兽医账号录入结果）</h2>
    <select id="checkAnimal"></select>
    <button class="primary" onclick="createCheck()">新建检查</button>
    <table><thead><tr><th>检查编号</th><th>动物</th><th>状态</th><th>录入兽医</th><th>操作</th></tr></thead>
    <tbody id="checksBody"></tbody></table>
  </section>

  <section>
    <h2>配对建议</h2>
    <label>父本</label><select id="pairSire"></select>
    <label>父本检查</label><select id="pairSireCheck"></select><br>
    <label>母本</label><select id="pairDam"></select>
    <label>母本检查</label><select id="pairDamCheck"></select><br>
    <button class="primary" onclick="createPairing()">协调员提交建议</button>
    <div id="pairings"></div>
  </section>
</main>
<div id="toast"></div>

<script>
const STATUS_CN = {
  active: '健康在馆', quarantined: '隔离中', departed: '已离馆', deceased: '已死亡',
  pending: '待录入', passed: '通过', failed: '不通过',
  proposed: '待批准', approved: '已批准', rejected: '已驳回', completed: '已登记产仔',
  planned: '计划中', authorized: '已许可', in_transit: '运输中'
};
const SIDE_CN = { sire: '父本', dam: '母本' };
const state = { animals: [], checks: [], pairings: [] };

function headers() {
  return {
    'Content-Type': 'application/json',
    'X-User-Id': document.getElementById('userId').value || 'anonymous',
    'X-Role': document.getElementById('role').value
  };
}
const shortId = id => String(id).slice(0, 8);
function tag(status) {
  const cls = String(status || '').toLowerCase();
  return `<span class="tag ${cls}">${STATUS_CN[cls] || cls}</span>`;
}
function toast(message, isError) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.className = isError ? 'error' : '';
  el.style.display = 'block';
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.style.display = 'none'; }, 6000);
}

async function api(path, options) {
  const response = await fetch(path, options);
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) {
    let message = payload.error || ('HTTP ' + response.status);
    if (payload.details) {
      const items = payload.details.blockers || payload.details.issues;
      if (items) message += '\n' + items.map(i => '• ' + i.message).join('\n');
    }
    throw new Error(message);
  }
  return payload;
}
const post = (path, body) => api(path, { method: 'POST', headers: headers(), body: JSON.stringify(body || {}) });
const action = (id, act, data) => post(`/api/entities/${id}/actions`, { action: act, data: data || {} });

async function loadAll() {
  const [animals, checks, pairings] = await Promise.all([
    fetch('/api/animals').then(r => r.json()),
    fetch('/api/health_checks').then(r => r.json()),
    fetch('/api/pairings').then(r => r.json())
  ]);
  state.animals = animals.items || [];
  state.checks = checks.items || [];
  state.pairings = pairings.items || [];
  render();
}

function render() {
  renderAnimals();
  renderChecks();
  renderPairings();
}

function renderAnimals() {
  const select = id => document.getElementById(id);
  for (const elId of ['checkAnimal', 'pairSire', 'pairDam']) {
    const el = select(elId);
    const keep = el.value;
    el.innerHTML = state.animals.map(a =>
      `<option value="${a.id}">${a.data.name || '未命名'} (${shortId(a.id)})</option>`).join('');
    el.value = keep;
  }
  select('animalsBody').innerHTML = state.animals.map(a => `
    <tr>
      <td><code>${shortId(a.id)}</code></td>
      <td>${a.data.name || ''}</td>
      <td>${a.data.sex}</td>
      <td>${tag(a.status)}</td>
      <td>
        <button onclick="animalAction('${a.id}','quarantine_animal',{reason:'观察'})" ${a.status !== 'active' ? 'disabled' : ''}>隔离</button>
        <button onclick="animalAction('${a.id}','release_quarantine',{})" ${a.status !== 'quarantined' ? 'disabled' : ''}>恢复健康</button>
        <button onclick="animalAction('${a.id}','depart_animal',{reason:'调出'})" ${['active', 'quarantined'].includes(a.status) ? '' : 'disabled'}>离馆</button>
        <button class="danger" onclick="animalAction('${a.id}','mark_deceased',{cause:'疾病'})" ${['active', 'quarantined'].includes(a.status) ? '' : 'disabled'}>死亡</button>
      </td>
    </tr>`).join('');
}

function renderChecks() {
  const animalName = id => (state.animals.find(a => a.id === id) || {}).data?.name || shortId(id);
  const checkOptions = animalId => state.checks
    .filter(c => c.data.animal_id === animalId)
    .map(c => `<option value="${c.id}">${shortId(c.id)} ${tag(c.status)}</option>`).join('');
  const sireEl = document.getElementById('pairSireCheck');
  const damEl = document.getElementById('pairDamCheck');
  sireEl.innerHTML = checkOptions(document.getElementById('pairSire').value);
  damEl.innerHTML = checkOptions(document.getElementById('pairDam').value);
  document.getElementById('checksBody').innerHTML = state.checks.map(c => `
    <tr>
      <td><code>${shortId(c.id)}</code></td>
      <td>${animalName(c.data.animal_id)}</td>
      <td>${tag(c.status)}</td>
      <td>${c.data.checked_by || '<span class="muted">未录入</span>'}</td>
      <td>
        <button onclick="checkResult('${c.id}','passed')" ${c.status !== 'pending' ? 'disabled' : ''}>通过</button>
        <button class="danger" onclick="checkResult('${c.id}','failed')" ${c.status !== 'pending' ? 'disabled' : ''}>不通过</button>
      </td>
    </tr>`).join('');
}

function sideCard(side) {
  const blocked = side.animal_status && side.animal_status !== 'active';
  return `<div class="side-card ${blocked ? 'blocked' : ''}">
    <strong>${SIDE_CN[side.side]}</strong>：
    ${side.animal_name || '未知'}（<code>${side.animal_id ? shortId(side.animal_id) : '缺失'}</code>）
    ${side.animal_status ? tag(side.animal_status) : ''}
    <div class="muted">检查编号 <code>${side.check_id ? shortId(side.check_id) : '缺失'}</code>
      ${side.check_status ? tag(side.check_status) : ''}
      ${side.checked_by ? ' 兽医 ' + side.checked_by : ''}
    </div>
    ${blocked ? `<div class="blocker">⚠ ${SIDE_CN[side.side]}方动物「${side.animal_name}」当前状态为${STATUS_CN[side.animal_status] || side.animal_status}，配对不得登记产仔</div>` : ''}
  </div>`;
}

async function renderPairings() {
  const container = document.getElementById('pairings');
  if (!state.pairings.length) {
    container.innerHTML = '<p class="muted">暂无配对建议</p>';
    return;
  }
  const reviews = await Promise.all(state.pairings.map(p =>
    fetch(`/api/pairings/${p.id}/review`).then(r => r.json())));
  container.innerHTML = reviews.map(r => `
    <div class="side-card" style="margin-top:.8rem">
      <div><strong>配对建议 <code>${shortId(r.id)}</code></strong> ${tag(r.status)}
        <span class="muted">提交人 ${r.proposed_by || ''}${r.approved_by ? ' · 批准人 ' + r.approved_by : ''}</span></div>
      <div class="muted">亲缘系数 ${r.inbreeding_coefficient}（上限 ${r.inbreeding_limit}）</div>
      ${sideCard(r.sides.sire)}
      ${sideCard(r.sides.dam)}
      ${r.approval_issues.map(i => `<div class="issue">• ${i.message}</div>`).join('')}
      ${r.blockers.map(b => `<div class="blocker">⛔ ${b.message}</div>`).join('')}
      <div style="margin-top:.4rem">
        <button class="primary" onclick="pairAction('${r.id}','approve',{})"
          ${r.status === 'proposed' && r.can_approve ? '' : 'disabled'}>委员会批准</button>
        <button class="danger" onclick="pairAction('${r.id}','reject',{reason:'委员会驳回'})"
          ${r.status === 'proposed' ? '' : 'disabled'}>驳回</button>
        <button onclick="pairAction('${r.id}','resubmit',{})"
          ${r.can_resubmit ? '' : 'disabled'}>重新送审</button>
        <button class="primary" onclick="pairAction('${r.id}','complete',{offspring_ids:[prompt('产仔编号')].filter(Boolean)})"
          ${r.status === 'approved' && r.can_register_offspring ? '' : 'disabled'}>登记产仔</button>
      </div>
    </div>`).join('');
}

async function createAnimal() {
  await run(() => post('/api/animals', {
    name: document.getElementById('animalName').value || '未命名',
    sex: document.getElementById('animalSex').value
  }), '动物已登记');
}
async function createCheck() {
  const animalId = document.getElementById('checkAnimal').value;
  await run(() => post('/api/health_checks', { animal_id: animalId }), '健康检查已新建，等待兽医录入');
}
async function createPairing() {
  await run(() => post('/api/pairings', {
    proposed_by: document.getElementById('userId').value,
    sire_id: document.getElementById('pairSire').value,
    dam_id: document.getElementById('pairDam').value,
    sire_check_id: document.getElementById('pairSireCheck').value,
    dam_check_id: document.getElementById('pairDamCheck').value
  }), '配对建议已提交');
}
async function checkResult(id, result) {
  await run(() => action(id, 'record_result', { result }), '检查结果已录入');
}
async function animalAction(id, act, data) {
  await run(() => action(id, act, data), '操作完成');
}
async function pairAction(id, act, data) {
  if (act === 'complete' && (!data.offspring_ids || !data.offspring_ids.length)) return;
  await run(() => action(id, act, data), '操作完成');
}
async function run(fn, okMessage) {
  try {
    await fn();
    toast(okMessage);
    await loadAll();
  } catch (err) {
    toast(err.message, true);
  }
}

document.getElementById('pairSire').addEventListener('change', renderChecks);
document.getElementById('pairDam').addEventListener('change', renderChecks);
loadAll().catch(err => toast(err.message, true));
</script>
</body>
</html>
